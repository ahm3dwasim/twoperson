[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twoperson"
version = "0.1.0"
description = "A two-person rule for AI coding agents: a ship report cannot be recorded without an approving verdict for that exact commit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "agents", "code-review", "claude-code", "codex", "llm", "guardrails", "multi-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["structlog>=23.1"]

[project.urls]
Homepage = "https://github.com/ahm3dwasim/twoperson"
Issues = "https://github.com/ahm3dwasim/twoperson/issues"

[project.scripts]
twoperson = "twoperson.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/twoperson"]
artifacts = ["src/twoperson/scripts/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
